name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios-test:
    runs-on: macos-15
    # main の実測は約 10 分。テストのハング（2026-09-30 run 36511216822 は 6 時間の既定上限まで
    # 止まった）を 30 分で fail に変換し、再実行で回復できるようにする。
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Prepare Secrets.xcconfig
        # 実値ファイルは .gitignore 済み（コミット禁止）。CI ではテンプレートを複製する。
        # ユニットテストのビルドに実値は不要。
        run: cp NewsListenApp/Secrets.example.xcconfig NewsListenApp/Secrets.xcconfig

      - name: Test Xcode Cloud configuration generation
        run: bash scripts/test-ci-post-clone.sh

      - name: "Check no HTTP status comparison outside Networking (verifies: CI-T13)"
        run: |
          set -euo pipefail
          SRC=NewsListenApp/NewsListenApp
          # 前提条件（spec §5 冒頭）: 対象ディレクトリの存在と、陽性対照（実在する型名）を確認する。
          # どちらかが失敗したら、以下の 0 件の記録は本物の 0 件ではないので即座に fail する。
          test -d "$SRC"
          grep -q 'enum APIEndpoint' "$SRC/Networking/APIEndpoint.swift"

          status_hits="$(grep -rn 'statusCode ==\|httpError(' "$SRC" --include='*.swift' | grep -v Networking/ || true)"
          if [ -n "$status_hits" ]; then
            echo "::error::Networking/ 外に statusCode ==/httpError( の数値比較が残っている"
            echo "$status_hits"
            exit 1
          fi

          apierror_hits="$(grep -rn 'APIError' "$SRC" --include='*.swift' | grep -v Networking/ || true)"
          if [ -n "$apierror_hits" ]; then
            echo "::error::Networking/ 外に APIError の参照が残っている"
            echo "$apierror_hits"
            exit 1
          fi

      - name: Run tests
        run: |
          set -o pipefail
          # ランナーで利用可能な最初の iPhone シミュレータを動的に選択（イメージ更新で
          # デバイス名が変わっても壊れないようにする）
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+( Pro( Max)?)?' | head -1)
          if [ -z "${DEVICE}" ]; then
            echo "::error::No available iPhone simulator found on runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Selected simulator: ${DEVICE}"
          xcodebuild test \
            -project NewsListenApp/NewsListenApp.xcodeproj \
            -scheme NewsListenApp \
            -destination "platform=iOS Simulator,name=${DEVICE}" \
            -only-testing:NewsListenAppTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
